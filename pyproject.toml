[project]
name = "avito-test"
version = "0.1.0"
description = "Local hybrid candidate generation for Avito services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bm25s>=0.3.11",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pystemmer>=3.1.0",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "snowballstemmer>=3.1.1",
    "torch>=2.7",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
